include:
  # tbkmini (Linux) – linke Hälfte mit ZMK Studio (USB)
  - board: nice_nano_v2
    shield: tbkmini_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: tbkmini_right
  # Skeletyl (macOS) – nur die linke Hälfte (Central) nutzt die Keymap,
  # die rechte Hälfte bekommt dieselbe tbkmini_right-Firmware.
  - board: nice_nano_v2
    shield: tbkmini_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DKEYMAP_FILE=${base_dir}/config/tbkmini_mac.keymap
    artifact-name: tbkmini_mac_left-nice_nano_v2-zmk
  - board: nice_nano_v2
    shield: settings_reset
